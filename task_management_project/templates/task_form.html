<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark px-3">
        <a href="/dashboard/" class="navbar-brand">Task Manager</a>
        <button class="btn btn-sm btn-light" onclick="logout()">Logout</button>
    </nav>

    <div class="container my-4" style="max-width: 600px;">
        <div class="card p-4">
            <!-- Same form is used for Add and Edit -->
            <h3 id="formTitle" class="mb-3">Add task</h3>
            <div id="message"></div>

            <form id="taskForm">
                <div class="mb-3">
                    <label class="form-label">Title *</label>
                    <input type="text" id="title" class="form-control" required maxlength="200">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="description" class="form-control" rows="4"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select">
                            <option>Todo</option>
                            <option>In Progress</option>
                            <option>Completed</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Priority</label>
                        <select id="priority" class="form-select">
                            <option>Low</option>
                            <option selected>Medium</option>
                            <option>High</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Due date</label>
                        <input type="date" id="due_date" class="form-control">
                    </div>
                </div>

                <button type="submit" id="saveButton" class="btn btn-main">Save task</button>
                <a href="/dashboard/" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script>
        requireLogin();

        // If URL has ?id=5 we are editing, otherwise adding
        const taskId = getUrlParam("id");

        async function loadTaskForEdit() {
            document.getElementById("formTitle").textContent = "Edit task";
            document.getElementById("saveButton").textContent = "Update task";

            const result = await apiRequest("/api/tasks/" + taskId + "/");
            if (!result.ok) {
                showMessage("message", getErrorText(result.data));
                return;
            }
            const task = result.data;
            document.getElementById("title").value = task.title;
            document.getElementById("description").value = task.description;
            document.getElementById("status").value = task.status;
            document.getElementById("priority").value = task.priority;
            document.getElementById("due_date").value = task.due_date || "";
        }

        if (taskId) loadTaskForEdit();

        document.getElementById("taskForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const taskData = {
                title: document.getElementById("title").value,
                description: document.getElementById("description").value,
                status: document.getElementById("status").value,
                priority: document.getElementById("priority").value,
                due_date: document.getElementById("due_date").value || null
            };

            let result;
            if (taskId) {
                result = await apiRequest("/api/tasks/" + taskId + "/", "PUT", taskData);   // Edit
            } else {
                result = await apiRequest("/api/tasks/", "POST", taskData);            // Add
            }

            if (result.ok) {
                window.location.href = "/dashboard/";
            } else {
                showMessage("message", getErrorText(result.data));
            }
        });
    </script>
</body>
</html>
