<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Top bar -->
    <nav class="navbar navbar-dark px-3">
        <span class="navbar-brand">Task Manager</span>
        <div class="text-white">
            Hi, <span id="usernameText"></span>
            <button class="btn btn-sm btn-light ms-2" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">My tasks</h3>
            <a href="/task-form/" class="btn btn-main">+ Add task</a>
        </div>

        <!-- Search & Filter -->
        <div class="card p-3 mb-3">
            <div class="row g-2">
                <div class="col-md-6">
                    <input type="text" id="searchBox" class="form-control" placeholder="Search by title...">
                </div>
                <div class="col-md-3">
                    <select id="statusFilter" class="form-select">
                        <option value="">All statuses</option>
                        <option>Todo</option>
                        <option>In Progress</option>
                        <option>Completed</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="priorityFilter" class="form-select">
                        <option value="">All priorities</option>
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Task table -->
        <div class="card p-3">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Due date</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="taskTable"></tbody>
                </table>
            </div>
            <p id="emptyText" class="text-muted text-center my-3" style="display:none;">
                No tasks found. Click "+ Add task" to create one.
            </p>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script>
        requireLogin();
        document.getElementById("usernameText").textContent = localStorage.getItem("username");

        // Load tasks from the API (with search and filters)
        async function loadTasks() {
            const search = document.getElementById("searchBox").value;
            const status = document.getElementById("statusFilter").value;
            const priority = document.getElementById("priorityFilter").value;

            const params = new URLSearchParams({ search, status, priority });
            const result = await apiRequest("/api/tasks/?" + params.toString());
            if (!result.ok) return;

            const tasks = result.data;
            const table = document.getElementById("taskTable");
            table.innerHTML = "";

            document.getElementById("emptyText").style.display = tasks.length === 0 ? "block" : "none";

            tasks.forEach(task => {
                table.innerHTML += `
                    <tr>
                        <td>${escapeHtml(task.title)}</td>
                        <td>${statusBadge(task.status)}</td>
                        <td>${priorityBadge(task.priority)}</td>
                        <td>${task.due_date || "-"}</td>
                        <td>${task.created_date}</td>
                        <td>
                            <a href="/task-detail/?id=${task.id}" class="btn btn-sm btn-outline-secondary">View</a>
                            <a href="/task-form/?id=${task.id}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <button onclick="deleteTask(${task.id})" class="btn btn-sm btn-outline-danger">Delete</button>
                        </td>
                    </tr>`;
            });
        }

        async function deleteTask(id) {
            if (!confirm("Delete this task?")) return;
            const result = await apiRequest("/api/tasks/" + id + "/", "DELETE");
            if (result.ok) loadTasks();
            else alert(getErrorText(result.data));
        }

        // Reload the list whenever search/filter changes
        document.getElementById("searchBox").addEventListener("input", loadTasks);
        document.getElementById("statusFilter").addEventListener("change", loadTasks);
        document.getElementById("priorityFilter").addEventListener("change", loadTasks);

        loadTasks();
    </script>
</body>
</html>
