<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-box card p-4">
        <h3 class="mb-3">Create account</h3>
        <div id="message"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required minlength="4">
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm password</label>
                <input type="password" id="confirmPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-main w-100">Register</button>
        </form>

        <p class="mt-3 mb-0 text-center">
            Already have an account? <a href="/">Login here</a>
        </p>
    </div>

    <script src="/static/js/script.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                showMessage("message", "Passwords do not match");
                return;
            }

            const result = await apiRequest("/api/register/", "POST", {
                username: document.getElementById("username").value,
                password: password
            });

            if (result.ok) {
                showMessage("message", "Registered! Taking you to login...", "success");
                setTimeout(() => window.location.href = "/", 1200);
            } else {
                showMessage("message", getErrorText(result.data));
            }
        });
    </script>
</body>
</html>
